# ローカルではresources/application-personal.yamlを読む
spring:
  profiles:
    include: personal

# App Engineの推奨に従いPORT環境変数で待ち受ける
server:
  port: ${PORT:8080}

# Bot設定
tts-bot:
  discord:
    bot-token: ${BOT_TOKEN}
  # 読み上げないテキストパターン
  ignore-patterns:
    - ".*https?://.*"
  # Botへの指示語
  command:
    # ボイスチャンネルへ接続
    connect: "k.con"
    # ボイスチャンネルから切断
    disconnect: "k.dc"
  google:
    text-to-speech:
      # TTS APIを叩くための認証トークン
      token: ${AUTH_TOKEN}
      # 言語
      language-code: "ja-JP"
      # 音声名
      name: "ja-JP-Wavenet-C"
      # 性別
      ssml-gender: male
      # オーディオエンコード
      audio-encoding: linear16
      # 発話速度
      speaking-rate: 1.25
      # ピッチ
      pitch: -3.0
